name: Build & Release iOS IPA

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔨 Build app without signing
        run: |
          xcodebuild clean build \
            -project ios/StackLaunch.xcodeproj \
            -scheme StackLaunch \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 🔐 Embed Entitlements and Package into IPA
        run: |
          APP_PATH="build_output/Build/Products/Release-iphoneos/StackLaunch.app"
          WIDGET_PATH="$APP_PATH/PlugIns/StackLaunchWidget.appex"
          
          echo "Injection des entitlements App Group via signature ad-hoc..."
          if [ -d "$WIDGET_PATH" ]; then
            codesign --force --sign - --entitlements ios/StackLaunchWidget/StackLaunchWidget.entitlements "$WIDGET_PATH"
          fi
          codesign --force --sign - --entitlements ios/StackLaunch/StackLaunch.entitlements "$APP_PATH"

          echo "Entitlements intégrés dans l'App :"
          codesign -d --entitlements :- "$APP_PATH" || true
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r StackLaunch-unsigned.ipa Payload

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackLaunch-unsigned
          path: StackLaunch-unsigned.ipa

      - name: 🏷️ Determine Tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "StackLaunch Dump-phone ${{ steps.vars.outputs.tag }}"
          body: |
            ## 📱 StackLaunch (Dumb Phone iOS Launcher) Release

            Transformez votre iPhone en téléphone minimaliste pour réduire votre temps d'écran :
            - 📦 **`StackLaunch-unsigned.ipa`** : Binaire iOS avec support WidgetKit et App Groups intégré.
            - 🛠️ Compatible avec **AltStore**, **SideStore**, **Sideloadly** ou **TrollStore**.
          files: StackLaunch-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
